[project]
name = "concisum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litestar>=2.0.0",
    "openai>=1.59.7",
    "pydantic>=2.10.5",
    "pydantic-ai>=0.1.1",
    "python-multipart",
    "typer>=0.15.1",
    "uvicorn>=0.27.0",
]

[project.scripts]
concisum = "concisum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["src/concisum"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "ruff>=0.8.6",
    "basedpyright>=1.29.0",
    "pytest>=8.3.5",
    "spacy>=3.8.14",
]
